[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issueai"
version = "0.1.0"
description = "Hypothesis-driven issue and bug discovery for real codebases."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "hi-mundo" }
]
license = { text = "MIT" }
dependencies = []

[project.scripts]
issueai = "issueai.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["issueai*"]

[tool.setuptools.package-data]
issueai = [
  "bug_hunt_runtime/workflow.json",
  "bug_hunt_runtime/assets/*",
  "bug_hunt_runtime/prompts/**/*.md",
  "bug_hunt_runtime/references/*.md",
  "bug_hunt_runtime/schemas/*.json",
  "bug_hunt_runtime/scripts/*.py",
  "bug_hunt_runtime/templates/**/*.md",
]
